<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>vue.js</title>
       <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
</head>
<body>
    <div id="app">
        <h2>tecnologias front-end</h2>
        <ul>
            <li v-for = "tec in tecnologias">{{tec}}</li>            
        </ul>
    </div>
    <script>
        const {createApp} = Vue 
        createApp({
            data(){
                return{
                    tecnologias: ['vue','react','angula','bootstrap']
                }
            }
        }).mount('#app')
    </script>
    
</body>
</html>
