<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>vue.js</title>
     <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
</head>
<body>
    <div id="app">
        <h2>{{contador}}</h2>
        <button @click="aumentar">aumentar</button>        
        <button @click="diminuir">diminuir</button>        
        <button @click="zera">zera</button>
    </div>
    <script>
    const {createApp} =Vue
    createApp({
        data(){
            return {
                contador:0
            }
        },
        methods:{
            aumentar() {
                    this.contador++
                },
                diminuir(){
                    this.diminuir--
                },
                zera(){
                    this.zera = 0
                }

            
        }
    }).mount('#app');
        
    </script>
    
</body>
